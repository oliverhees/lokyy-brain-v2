# E2E stand-in for the stack blueprint of LBV2-27: groups of the contract, slot + portal providers,
# and the portal's least-privilege service account. Public port from E2E_PUBLIC_PORT (run.sh).
version: 1
metadata:
  name: lokyy-portal-e2e
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Scope mappings must exist before providers reference them (otherwise a provider can end up without
  # mappings and the outpost sends an empty X-authentik-username: QA HIGH 1).
  - model: authentik_blueprints.metaapplyblueprint
    attrs: { identifiers: { name: System - OAuth2 Provider - Scopes }, required: true }
  - model: authentik_blueprints.metaapplyblueprint
    attrs: { identifiers: { name: System - Proxy Provider - Scopes }, required: true }

  - { model: authentik_core.group, id: g-v01, identifiers: { name: vault-v01 }, attrs: { name: vault-v01 } }
  - { model: authentik_core.group, id: g-v02, identifiers: { name: vault-v02 }, attrs: { name: vault-v02 } }
  - { model: authentik_core.group, id: g-fr, identifiers: { name: vault-firma-read }, attrs: { name: vault-firma-read } }
  - { model: authentik_core.group, id: g-fw, identifiers: { name: vault-firma-write }, attrs: { name: vault-firma-write } }
  - { model: authentik_core.group, id: g-admins, identifiers: { name: lokyy-admins }, attrs: { name: lokyy-admins } }
  - { model: authentik_core.group, id: g-users, identifiers: { name: lokyy-users }, attrs: { name: lokyy-users } }
  - model: authentik_core.user
    identifiers: { username: akadmin }
    state: present
    attrs:
      # Blueprint m2m attrs REPLACE the set: keep the bootstrap superuser group (LBV2-29 pattern).
      groups: [!Find [authentik_core.group, [name, "authentik Admins"]], !KeyOf g-admins]

  # ---------------------------------------------------- portal service account (least privilege)
  # Exactly the API calls of apps/portal/src/server/authentik.ts. No superuser, no RBAC/role, no flow,
  # provider or token permissions. Taking over admin accounts via recovery links is blocked by the
  # policy on the lokyy-set-password flow (apps/portal/authentik/lokyy-portal.yaml).
  - model: authentik_rbac.role
    id: role-portal
    identifiers: { name: lokyy-portal }
    attrs:
      name: lokyy-portal
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.delete_user
        - authentik_core.reset_user_password
        - authentik_core.view_group
        - authentik_core.add_user_to_group
        - authentik_core.remove_user_from_group
        - authentik_core.view_authenticatedsession
        - authentik_core.delete_authenticatedsession
  - model: authentik_core.user
    id: sa-portal
    identifiers: { username: lokyy-portal }
    attrs:
      username: lokyy-portal
      name: Lokyy Portal (service account)
      type: service_account
      path: lokyy-system
      roles: [!KeyOf role-portal]
  - model: authentik_core.token
    identifiers: { identifier: lokyy-portal-api }
    attrs:
      identifier: lokyy-portal-api
      intent: api
      user: !KeyOf sa-portal
      expiring: false
      key: !Env PORTAL_AUTHENTIK_TOKEN

  # ------------------------------------------------------------------ providers
  - model: authentik_providers_proxy.proxyprovider
    id: p-portal
    identifiers: { name: portal }
    attrs: &provider
      name: portal
      mode: forward_single
      external_host: !Format ["http://app.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=8
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
  # Portal: employees (lokyy-users) and admins; the portal itself decides admin vs. self by group.
  - model: authentik_core.application
    id: a-portal
    identifiers: { slug: portal }
    attrs: { name: Lokyy Portal, slug: portal, provider: !KeyOf p-portal, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf a-portal, group: !KeyOf g-users }
    attrs: { target: !KeyOf a-portal, group: !KeyOf g-users, order: 0 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf a-portal, group: !KeyOf g-admins }
    attrs: { target: !KeyOf a-portal, group: !KeyOf g-admins, order: 1 }

  - model: authentik_providers_proxy.proxyprovider
    id: p-v01
    identifiers: { name: vault-v01 }
    attrs:
      <<: *provider
      name: vault-v01
      external_host: !Format ["http://v01.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
  - model: authentik_core.application
    id: a-v01
    identifiers: { slug: vault-v01 }
    attrs: { name: Vault v01, slug: vault-v01, provider: !KeyOf p-v01, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf a-v01, group: !KeyOf g-v01 }
    attrs: { target: !KeyOf a-v01, group: !KeyOf g-v01, order: 0 }

  - model: authentik_providers_proxy.proxyprovider
    id: p-v02
    identifiers: { name: vault-v02 }
    attrs:
      <<: *provider
      name: vault-v02
      external_host: !Format ["http://v02.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
  - model: authentik_core.application
    id: a-v02
    identifiers: { slug: vault-v02 }
    attrs: { name: Vault v02, slug: vault-v02, provider: !KeyOf p-v02, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf a-v02, group: !KeyOf g-v02 }
    attrs: { target: !KeyOf a-v02, group: !KeyOf g-v02, order: 0 }

  # Company vault web UI: writers only
  - model: authentik_providers_proxy.proxyprovider
    id: p-firma
    identifiers: { name: vault-firma }
    attrs:
      <<: *provider
      name: vault-firma
      external_host: !Format ["http://firma.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
  - model: authentik_core.application
    id: a-firma
    identifiers: { slug: vault-firma }
    attrs: { name: Firmen-Vault, slug: vault-firma, provider: !KeyOf p-firma, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf a-firma, group: !KeyOf g-fw }
    attrs: { target: !KeyOf a-firma, group: !KeyOf g-fw, order: 0 }

  - model: authentik_outposts.outpost
    identifiers: { managed: goauthentik.io/outposts/embedded }
    state: present
    attrs:
      providers: [!KeyOf p-portal, !KeyOf p-v01, !KeyOf p-v02, !KeyOf p-firma]
      config:
        authentik_host: !Format ["http://auth.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
        authentik_host_browser: !Format ["http://auth.portal.localhost:%s", !Env E2E_PUBLIC_PORT]
