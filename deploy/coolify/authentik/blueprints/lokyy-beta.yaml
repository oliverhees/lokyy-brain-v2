# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Lokyy Brain v2 — Coolify beta (LBV2-16): groups, one forward-auth proxy provider + application per vault
# slot and group-based access bindings. Unlike deploy/stack (demo users bound directly), NO users are
# created here: the admin creates beta users in the Authentik UI and adds them to groups
# (docs/beta-runbook.md). Usernames: plain ASCII, ^[a-z][a-z0-9-]*$, no "@".
version: 1
metadata:
  name: lokyy-beta
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ---------------------------------------------------------------- groups
  # Web access to a personal vault slot (exactly one user per group)
  - { model: authentik_core.group, id: group-u1-access, identifiers: { name: vault-u1-access }, attrs: { name: vault-u1-access } }
  - { model: authentik_core.group, id: group-u2-access, identifiers: { name: vault-u2-access }, attrs: { name: vault-u2-access } }
  - { model: authentik_core.group, id: group-u3-access, identifiers: { name: vault-u3-access }, attrs: { name: vault-u3-access } }
  # Vault administrators (config changes, VAULT_ADMIN_GROUPS)
  - { model: authentik_core.group, id: group-u1-admin, identifiers: { name: vault-u1-admin }, attrs: { name: vault-u1-admin } }
  - { model: authentik_core.group, id: group-u2-admin, identifiers: { name: vault-u2-admin }, attrs: { name: vault-u2-admin } }
  - { model: authentik_core.group, id: group-u3-admin, identifiers: { name: vault-u3-admin }, attrs: { name: vault-u3-admin } }
  - { model: authentik_core.group, id: group-firma-write, identifiers: { name: vault-firma-write }, attrs: { name: vault-firma-write } }
  - { model: authentik_core.group, id: group-firma-read, identifiers: { name: vault-firma-read }, attrs: { name: vault-firma-read } }
  - { model: authentik_core.group, id: group-firma-admin, identifiers: { name: vault-firma-admin }, attrs: { name: vault-firma-admin } }
  - { model: authentik_core.group, id: group-admins, identifiers: { name: lokyy-admins }, attrs: { name: lokyy-admins } }
  - model: authentik_core.user
    identifiers: { username: akadmin }
    state: present
    attrs:
      groups: [!KeyOf group-admins]

  # ------------------------------------------------- providers + applications
  - model: authentik_providers_proxy.proxyprovider
    id: provider-u1
    identifiers: { name: vault-u1 }
    attrs: &provider
      name: vault-u1
      mode: forward_single
      external_host: !Format ["https://%s.vault.%s", !Env VAULT_U1_USER, !Env LOKYY_DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=8
  - model: authentik_core.application
    id: app-u1
    identifiers: { slug: vault-u1 }
    attrs: { name: Vault (u1), slug: vault-u1, provider: !KeyOf provider-u1, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-u1, group: !KeyOf group-u1-access }
    attrs: { target: !KeyOf app-u1, group: !KeyOf group-u1-access, order: 0 }

  - model: authentik_providers_proxy.proxyprovider
    id: provider-u2
    identifiers: { name: vault-u2 }
    attrs:
      <<: *provider
      name: vault-u2
      external_host: !Format ["https://%s.vault.%s", !Env VAULT_U2_USER, !Env LOKYY_DOMAIN]
  - model: authentik_core.application
    id: app-u2
    identifiers: { slug: vault-u2 }
    attrs: { name: Vault (u2), slug: vault-u2, provider: !KeyOf provider-u2, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-u2, group: !KeyOf group-u2-access }
    attrs: { target: !KeyOf app-u2, group: !KeyOf group-u2-access, order: 0 }

  - model: authentik_providers_proxy.proxyprovider
    id: provider-u3
    identifiers: { name: vault-u3 }
    attrs:
      <<: *provider
      name: vault-u3
      external_host: !Format ["https://%s.vault.%s", !Env VAULT_U3_USER, !Env LOKYY_DOMAIN]
  - model: authentik_core.application
    id: app-u3
    identifiers: { slug: vault-u3 }
    attrs: { name: Vault (u3), slug: vault-u3, provider: !KeyOf provider-u3, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-u3, group: !KeyOf group-u3-access }
    attrs: { target: !KeyOf app-u3, group: !KeyOf group-u3-access, order: 0 }

  # Company vault web UI: only writers (readers use MCP with the read-only token)
  - model: authentik_providers_proxy.proxyprovider
    id: provider-firma
    identifiers: { name: vault-firma }
    attrs:
      <<: *provider
      name: vault-firma
      external_host: !Format ["https://firma.vault.%s", !Env LOKYY_DOMAIN]
  - model: authentik_core.application
    id: app-firma
    identifiers: { slug: vault-firma }
    attrs: { name: Firmen-Vault, slug: vault-firma, provider: !KeyOf provider-firma, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-firma, group: !KeyOf group-firma-write }
    attrs: { target: !KeyOf app-firma, group: !KeyOf group-firma-write, order: 0 }

  # MetaMCP admin UI: admins only
  - model: authentik_providers_proxy.proxyprovider
    id: provider-metamcp
    identifiers: { name: metamcp-admin }
    attrs:
      <<: *provider
      name: metamcp-admin
      external_host: !Format ["https://mcp.%s", !Env LOKYY_DOMAIN]
  - model: authentik_core.application
    id: app-metamcp
    identifiers: { slug: metamcp-admin }
    attrs: { name: MetaMCP Admin, slug: metamcp-admin, provider: !KeyOf provider-metamcp, policy_engine_mode: any }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-metamcp, group: !KeyOf group-admins }
    attrs: { target: !KeyOf app-metamcp, group: !KeyOf group-admins, order: 0 }

  # ------------------------------------------------------ embedded outpost
  - model: authentik_outposts.outpost
    identifiers: { managed: goauthentik.io/outposts/embedded }
    state: present
    attrs:
      providers:
        - !KeyOf provider-u1
        - !KeyOf provider-u2
        - !KeyOf provider-u3
        - !KeyOf provider-firma
        - !KeyOf provider-metamcp
      config:
        authentik_host: !Format ["https://auth.%s", !Env LOKYY_DOMAIN]
        authentik_host_browser: !Format ["https://auth.%s", !Env LOKYY_DOMAIN]
