      title: Lokyy Brain
      designation: authentication
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf flow-lokyy-authentication, stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]], order: 10 }
  - model: authentik_flows.flowstagebinding
    id: binding-lokyy-20
    identifiers: { target: !KeyOf flow-lokyy-authentication, stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]], order: 20 }
    attrs:
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    id: binding-lokyy-30
    identifiers: { target: !KeyOf flow-lokyy-authentication, stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]], order: 30 }
    attrs:
