  metamcp-db:
    image: "postgres:16-alpine"
    restart: "unless-stopped"
    mem_limit: "512m"
    environment:
      POSTGRES_DB: "metamcp"
      POSTGRES_USER: "metamcp"
      POSTGRES_PASSWORD: "${SERVICE_HEX_64_METAMCPDB}"
    volumes:
      - "metamcp-db:/var/lib/postgresql/data"
