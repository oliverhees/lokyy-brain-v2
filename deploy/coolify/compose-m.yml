  authentik-db:
    image: "postgres:16-alpine"
    restart: "unless-stopped"
    mem_limit: "512m"
    environment:
      POSTGRES_DB: "authentik"
      POSTGRES_USER: "authentik"
      POSTGRES_PASSWORD: "${SERVICE_HEX_64_AUTHENTIKDB}"
    volumes:
      - "authentik-db:/var/lib/postgresql/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -d authentik -U authentik"
      interval: "10s"
      retries: 10
    networks:
      - "authentik-internal"
  authentik-server:
    build:
      context: "../.."
      dockerfile: "deploy/coolify/authentik/Dockerfile"
      args:
        LOKYY_PACKAGE: "m"
    restart: "unless-stopped"
    command:
      - "server"
    mem_limit: "1g"
    depends_on:
      authentik-db:
        condition: "service_healthy"
    environment:
      AUTHENTIK_POSTGRESQL__HOST: "authentik-db"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
      AUTHENTIK_POSTGRESQL__USER: "authentik"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${SERVICE_HEX_64_AUTHENTIKDB}"
      AUTHENTIK_SECRET_KEY: "${SERVICE_HEX_64_AUTHENTIKSECRET}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "${ADMIN_EMAIL:?set ADMIN_EMAIL in Coolify}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${SERVICE_PASSWORD_ADMIN}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${SERVICE_HEX_64_AUTHENTIKAPITOKEN}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      BASE_DOMAIN: "${BASE_DOMAIN:?set BASE_DOMAIN in Coolify}"
    shm_size: "512mb"
    networks:
      - "edge"
      - "authentik-internal"
  authentik-worker:
    build:
      context: "../.."
      dockerfile: "deploy/coolify/authentik/Dockerfile"
      args:
        LOKYY_PACKAGE: "m"
    restart: "unless-stopped"
    command:
      - "worker"
    mem_limit: "1g"
    depends_on:
      authentik-db:
        condition: "service_healthy"
    environment:
      AUTHENTIK_POSTGRESQL__HOST: "authentik-db"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
