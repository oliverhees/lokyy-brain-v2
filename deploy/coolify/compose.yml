# Lokyy Brain v2 — Coolify template for ONE company server (LBV2-16)
#
# Derived from the verified local stack deploy/stack/compose.yml (LBV2-2/-4/-5/-19). Every difference
# is marked "COOLIFY:" and explained in docs/beta-runbook.md ("Differences to deploy/stack").
#
#   https://auth.<LOKYY_DOMAIN>                    Authentik (login portal, admin)
#   https://<VAULT_U1_USER>.vault.<LOKYY_DOMAIN>   personal vault slot u1 (group vault-u1-access)
#   https://<VAULT_U2_USER>.vault.<LOKYY_DOMAIN>   personal vault slot u2 (group vault-u2-access)
#   https://<VAULT_U3_USER>.vault.<LOKYY_DOMAIN>   personal vault slot u3 (group vault-u3-access)
#   https://firma.vault.<LOKYY_DOMAIN>             company vault web UI (group vault-firma-write)
#   https://mcp.<LOKYY_DOMAIN>                     MetaMCP admin (lokyy-admins) + /metamcp/<user>/mcp (API key)
#
# Request path: internet -> coolify-proxy (TLS, Let's Encrypt) -> lokyy-traefik (forward-auth, proxy
# secrets, mcp-gate routing) -> service. Network model unchanged from deploy/stack:
#   edge        lokyy-traefik <-> authentik, metamcp, mcp-gate
#   web-<vault> lokyy-traefik <-> exactly one vault web UI     (internal, no egress)
#   mcp-<vault> vault-connector <-> exactly one vault MCP port (internal, no egress)
#   egress      vaults -> internet (EUrouter); inter-container traffic disabled
# COOLIFY: only lokyy-traefik joins the external "coolify" network. No service publishes a host port.

x-vault: &vault
  image: lokyy-brain-v2:beta
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  # COOLIFY: memory limit per vault (none in deploy/stack). LBV2-20: idle ~200 MiB, peak 2.62 GiB with bge-m3
  # loaded (stays resident until restart), so 3500m leaves headroom.
  mem_limit: ${VAULT_MEM_LIMIT:-3500m}
  depends_on:
    model-prefetch: { condition: service_completed_successfully }
  environment: &vault-env
    MCP_HTTP_PORT: "4322"
    MINDBASE_MDNS: "off"
    # Beta decision: no capture / device pairing on hosted vaults
    MINDBASE_DISABLE_CAPTURE: "1"
    # LBV2-19: guarded vaults only call LLM hosts on this list (web server and MCP process)
    VAULT_LLM_ALLOWED_HOSTS: api.eurouter.ai
    # Persistent, per-vault cache for tesseract language data (/models is read-only and shared)
    MINDBASE_MODEL_CACHE: /home/vault
    # LBV2-24: transformers.js never downloads in a vault, only the verified /models cache is used
    NODE_OPTIONS: --import=/lokyy/offline.mjs

services:
  # COOLIFY: the inner Traefik keeps the routing/middleware model of deploy/stack unchanged. It publishes
  # no port; coolify-proxy terminates TLS and forwards the Lokyy hostnames to it over the "coolify" network.
  lokyy-traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # COOLIFY: constraint on an own label instead of com.docker.compose.project (Coolify sets the
      # project name to the resource UUID). Labels of other Coolify resources are ignored.
      - --providers.docker.constraints=Label(`lokyy.stack`,`${LOKYY_STACK_ID:-lokyy}`)
      - --entrypoints.web.address=:80
      # COOLIFY: X-Forwarded-* trusted only from the coolify-proxy container IP (docs/beta-runbook.md, section 4)
      - --entrypoints.web.forwardedHeaders.trustedIPs=${COOLIFY_PROXY_IP:?set to the coolify-proxy IP on the coolify network}/32
      - --api.dashboard=false
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # Read by coolify-proxy only: this container has no lokyy.stack label, so the inner Traefik skips it.
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.lokyy-https.rule=Host(`auth.${LOKYY_DOMAIN}`) || Host(`mcp.${LOKYY_DOMAIN}`) || Host(`${VAULT_U1_USER}.vault.${LOKYY_DOMAIN}`) || Host(`${VAULT_U2_USER}.vault.${LOKYY_DOMAIN}`) || Host(`${VAULT_U3_USER}.vault.${LOKYY_DOMAIN}`) || Host(`firma.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.lokyy-https.entrypoints=https
      - traefik.http.routers.lokyy-https.tls=true
      - traefik.http.routers.lokyy-https.tls.certresolver=letsencrypt
      - traefik.http.routers.lokyy-https.service=lokyy-inner
      - traefik.http.routers.lokyy-http.rule=Host(`auth.${LOKYY_DOMAIN}`) || Host(`mcp.${LOKYY_DOMAIN}`) || Host(`${VAULT_U1_USER}.vault.${LOKYY_DOMAIN}`) || Host(`${VAULT_U2_USER}.vault.${LOKYY_DOMAIN}`) || Host(`${VAULT_U3_USER}.vault.${LOKYY_DOMAIN}`) || Host(`firma.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.lokyy-http.entrypoints=http
      - traefik.http.routers.lokyy-http.middlewares=lokyy-to-https
      - traefik.http.routers.lokyy-http.service=lokyy-inner
      - traefik.http.middlewares.lokyy-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.lokyy-to-https.redirectscheme.permanent=true
      - traefik.http.services.lokyy-inner.loadbalancer.server.port=80
    networks: [coolify, edge, web-u1, web-u2, web-u3, web-firma]

  # ---------------------------------------------------------------- Authentik
  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?set in Coolify env}
    volumes: [authentik-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      retries: 10
    networks: [authentik-internal]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: server
    mem_limit: 1g
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in Coolify env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASS:?set in Coolify env}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:?set in Coolify env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      # COOLIFY: no demo users/passwords; the beta blueprint only needs the public hostnames
      LOKYY_DOMAIN: ${LOKYY_DOMAIN:?set in Coolify env}
      VAULT_U1_USER: ${VAULT_U1_USER:?set in Coolify env}
      VAULT_U2_USER: ${VAULT_U2_USER:?set in Coolify env}
      VAULT_U3_USER: ${VAULT_U3_USER:?set in Coolify env}
    volumes:
      # COOLIFY: absolute host path (checkout on the server). Coolify does not populate relative bind mounts
      # from the repository.
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/coolify/authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-edge
      - traefik.http.routers.authentik.rule=Host(`auth.${LOKYY_DOMAIN}`)
      - traefik.http.routers.authentik.entrypoints=web
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      # Forward-auth middleware used by every vault router
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      # authResponseHeaders are deleted from the client request and replaced by Authentik's values
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-uid
      # Defence in depth: legacy attribution header never reaches a vault from a client
      - traefik.http.middlewares.vault-identity.headers.customrequestheaders.X-Mindbase-User=
    networks: [edge, authentik-internal]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: worker
    mem_limit: 1g
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: *authentik-env
    volumes:
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/coolify/authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    networks: [authentik-internal]

  # ------------------------------------------------------------------- Vaults
  # One-shot: fills the shared model cache that vaults mount read-only. Pinned Hugging Face revision,
  # SHA-256 per file (deploy/stack/models/manifest.json). Needs internet on the first start.
  model-prefetch:
    image: lokyy-brain-v2:beta
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: "no"
    entrypoint: ["node", "/prefetch/prefetch.mjs"]
    volumes:
      - models:/models
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/models:/prefetch:ro
    networks: [model-egress]

  # COOLIFY: vault slots u1..u3 instead of fixed demo names. The public hostname comes from VAULT_U<n>_USER;
  # service, network, token and group names stay slot-based. Add a slot: copy a block + its two networks,
  # volumes, connector entries, lokyy-traefik network/host rule and the blueprint entries (runbook).
  vault-u1:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_U1:?set in Coolify env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-u1:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_U1:?set in Coolify env}
      VAULT_ADMIN_GROUPS: vault-u1-admin,lokyy-admins
    volumes:
      - vault-u1:/data
      - models:/models:ro
      - vault-u1-home:/home/vault
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/models/offline.mjs:/lokyy/offline.mjs:ro
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-web-u1
      - traefik.http.routers.vault-u1.rule=Host(`${VAULT_U1_USER}.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.vault-u1.entrypoints=web
      - traefik.http.routers.vault-u1.middlewares=vault-u1-fwd@docker,authentik@docker,vault-identity@docker,vault-u1-secret@docker
      # COOLIFY: pin X-Forwarded-Host/Proto to this router's host before forward-auth; a forged header must not
      # select another vault's Authentik provider (forwarded headers are trusted from coolify-proxy)
      - traefik.http.middlewares.vault-u1-fwd.headers.customrequestheaders.X-Forwarded-Host=${VAULT_U1_USER}.vault.${LOKYY_DOMAIN}
      - traefik.http.middlewares.vault-u1-fwd.headers.customrequestheaders.X-Forwarded-Proto=https
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-u1-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_U1}
      - traefik.http.services.vault-u1.loadbalancer.server.port=4321
      # Authentik callback path on the same host must bypass forward-auth
      - traefik.http.routers.vault-u1-outpost.rule=Host(`${VAULT_U1_USER}.vault.${LOKYY_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-u1-outpost.entrypoints=web
      - traefik.http.routers.vault-u1-outpost.service=authentik
      - traefik.http.routers.vault-u1-outpost.middlewares=vault-u1-fwd@docker
    networks:
      web-u1: {}
      mcp-u1: { aliases: [upstream.vault-u1] }
      egress: {}

  vault-u2:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_U2:?set in Coolify env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-u2:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_U2:?set in Coolify env}
      VAULT_ADMIN_GROUPS: vault-u2-admin,lokyy-admins
    volumes:
      - vault-u2:/data
      - models:/models:ro
      - vault-u2-home:/home/vault
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/models/offline.mjs:/lokyy/offline.mjs:ro
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-web-u2
      - traefik.http.routers.vault-u2.rule=Host(`${VAULT_U2_USER}.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.vault-u2.entrypoints=web
      - traefik.http.routers.vault-u2.middlewares=vault-u2-fwd@docker,authentik@docker,vault-identity@docker,vault-u2-secret@docker
      # COOLIFY: pin X-Forwarded-Host/Proto to this router's host before forward-auth; a forged header must not
      # select another vault's Authentik provider (forwarded headers are trusted from coolify-proxy)
      - traefik.http.middlewares.vault-u2-fwd.headers.customrequestheaders.X-Forwarded-Host=${VAULT_U2_USER}.vault.${LOKYY_DOMAIN}
      - traefik.http.middlewares.vault-u2-fwd.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.vault-u2-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_U2}
      - traefik.http.services.vault-u2.loadbalancer.server.port=4321
      - traefik.http.routers.vault-u2-outpost.rule=Host(`${VAULT_U2_USER}.vault.${LOKYY_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-u2-outpost.entrypoints=web
      - traefik.http.routers.vault-u2-outpost.service=authentik
      - traefik.http.routers.vault-u2-outpost.middlewares=vault-u2-fwd@docker
    networks:
      web-u2: {}
      mcp-u2: { aliases: [upstream.vault-u2] }
      egress: {}

  vault-u3:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_U3:?set in Coolify env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-u3:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_U3:?set in Coolify env}
      VAULT_ADMIN_GROUPS: vault-u3-admin,lokyy-admins
    volumes:
      - vault-u3:/data
      - models:/models:ro
      - vault-u3-home:/home/vault
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/models/offline.mjs:/lokyy/offline.mjs:ro
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-web-u3
      - traefik.http.routers.vault-u3.rule=Host(`${VAULT_U3_USER}.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.vault-u3.entrypoints=web
      - traefik.http.routers.vault-u3.middlewares=vault-u3-fwd@docker,authentik@docker,vault-identity@docker,vault-u3-secret@docker
      # COOLIFY: pin X-Forwarded-Host/Proto to this router's host before forward-auth; a forged header must not
      # select another vault's Authentik provider (forwarded headers are trusted from coolify-proxy)
      - traefik.http.middlewares.vault-u3-fwd.headers.customrequestheaders.X-Forwarded-Host=${VAULT_U3_USER}.vault.${LOKYY_DOMAIN}
      - traefik.http.middlewares.vault-u3-fwd.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.vault-u3-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_U3}
      - traefik.http.services.vault-u3.loadbalancer.server.port=4321
      - traefik.http.routers.vault-u3-outpost.rule=Host(`${VAULT_U3_USER}.vault.${LOKYY_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-u3-outpost.entrypoints=web
      - traefik.http.routers.vault-u3-outpost.service=authentik
      - traefik.http.routers.vault-u3-outpost.middlewares=vault-u3-fwd@docker
    networks:
      web-u3: {}
      mcp-u3: { aliases: [upstream.vault-u3] }
      egress: {}

  vault-firma:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_FIRMA:?set in Coolify env}
      # Readers of the company vault (group vault-firma-read) get this token via MetaMCP: read tools only
      MCP_HTTP_READONLY_TOKEN: ${MCP_READONLY_TOKEN_FIRMA:?set in Coolify env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-firma:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_FIRMA:?set in Coolify env}
      VAULT_ADMIN_GROUPS: vault-firma-admin,lokyy-admins
    volumes:
      - vault-firma:/data
      - models:/models:ro
      - vault-firma-home:/home/vault
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/models/offline.mjs:/lokyy/offline.mjs:ro
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-web-firma
      - traefik.http.routers.vault-firma.rule=Host(`firma.vault.${LOKYY_DOMAIN}`)
      - traefik.http.routers.vault-firma.entrypoints=web
      - traefik.http.routers.vault-firma.middlewares=vault-firma-fwd@docker,authentik@docker,vault-identity@docker,vault-firma-secret@docker
      # COOLIFY: pin X-Forwarded-Host/Proto to this router's host before forward-auth; a forged header must not
      # select another vault's Authentik provider (forwarded headers are trusted from coolify-proxy)
      - traefik.http.middlewares.vault-firma-fwd.headers.customrequestheaders.X-Forwarded-Host=firma.vault.${LOKYY_DOMAIN}
      - traefik.http.middlewares.vault-firma-fwd.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.vault-firma-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_FIRMA}
      - traefik.http.services.vault-firma.loadbalancer.server.port=4321
      - traefik.http.routers.vault-firma-outpost.rule=Host(`firma.vault.${LOKYY_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-firma-outpost.entrypoints=web
      - traefik.http.routers.vault-firma-outpost.service=authentik
      - traefik.http.routers.vault-firma-outpost.middlewares=vault-firma-fwd@docker
    networks:
      web-firma: {}
      mcp-firma: { aliases: [upstream.vault-firma] }
      egress: {}

  # ------------------------------------------------------------------ MetaMCP
  metamcp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: metamcp
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS:?set in Coolify env}
    volumes: [metamcp-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d metamcp -U metamcp"]
      interval: 10s
      retries: 10
    networks: [metamcp-internal]

  metamcp:
    image: ghcr.io/metatool-ai/metamcp:2.4.22
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      metamcp-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://metamcp:${METAMCP_PG_PASS}@metamcp-db:5432/metamcp
      POSTGRES_HOST: metamcp-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS}
      POSTGRES_DB: metamcp
      APP_URL: https://mcp.${LOKYY_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://mcp.${LOKYY_DOMAIN}
      BETTER_AUTH_SECRET: ${METAMCP_AUTH_SECRET:?set in Coolify env}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-edge
      # Admin UI behind Authentik (group lokyy-admins); /metamcp/* is never served by the admin router
      - traefik.http.routers.metamcp.rule=Host(`mcp.${LOKYY_DOMAIN}`) && !PathPrefix(`/metamcp/`)
      - traefik.http.routers.metamcp.entrypoints=web
      - traefik.http.routers.metamcp.middlewares=metamcp-fwd@docker,authentik@docker
      # COOLIFY: pin X-Forwarded-Host/Proto before forward-auth (see vault routers)
      - traefik.http.middlewares.metamcp-fwd.headers.customrequestheaders.X-Forwarded-Host=mcp.${LOKYY_DOMAIN}
      - traefik.http.middlewares.metamcp-fwd.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.metamcp-outpost.rule=Host(`mcp.${LOKYY_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.metamcp-outpost.entrypoints=web
      - traefik.http.routers.metamcp-outpost.service=authentik
      - traefik.http.routers.metamcp-outpost.middlewares=metamcp-fwd@docker
      - traefik.http.services.metamcp.loadbalancer.server.port=12008
    # No egress, no vault network: vaults are reached only through vault-connector (mcp-upstream)
    networks: [edge, metamcp-internal, mcp-upstream]

  # Session-binding proxy for MCP clients (finding M2). Only POST/GET/DELETE on /metamcp/<name>/mcp.
  mcp-gate:
    image: lokyy-mcp-gate:beta
    build: ../stack/mcp-gate
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: gate
      GATE_UPSTREAM: http://metamcp:12008
      # LBV2-24: global session cap = users × 20 × 1.25 (min 100). users.beta.json must exist before `up`
      # (docs/beta-runbook.md), otherwise Docker creates a directory at that path.
      GATE_USERS_FILE: /etc/lokyy/users.json
    volumes:
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/users.beta.json:/etc/lokyy/users.json:ro
    depends_on:
      metamcp: { condition: service_healthy }
    labels:
      - lokyy.stack=${LOKYY_STACK_ID:-lokyy}
      - traefik.enable=true
      - traefik.docker.network=lokyy-edge
      - traefik.http.routers.metamcp-endpoints.rule=Host(`mcp.${LOKYY_DOMAIN}`) && PathRegexp(`^/metamcp/[a-z0-9-]+/mcp$`)
      - traefik.http.routers.metamcp-endpoints.entrypoints=web
      - traefik.http.routers.metamcp-endpoints.priority=100
      - traefik.http.routers.metamcp-endpoints.service=mcp-gate
      - traefik.http.services.mcp-gate.loadbalancer.server.port=8080
      - traefik.http.routers.metamcp-endpoints.middlewares=metamcp-ratelimit@docker,metamcp-uniform-errors@docker
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.burst=60
      # COOLIFY: behind coolify-proxy the TCP peer is always the proxy. Rate-limit per real client
      # (right-most X-Forwarded-For entry, appended by coolify-proxy), not one bucket for everybody.
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1
      - traefik.http.middlewares.metamcp-uniform-errors.errors.status=400-428,430-599
      - traefik.http.middlewares.metamcp-uniform-errors.errors.service=mcp-gate
      - traefik.http.middlewares.metamcp-uniform-errors.errors.query=/__error
      - traefik.http.middlewares.metamcp-uniform-errors.errors.statusRewrites.403=401
      - traefik.http.middlewares.metamcp-uniform-errors.errors.statusRewrites.404=401
    networks: [edge]

  # One-way path MetaMCP -> vaults; listens only on its fixed mcp-upstream address, routes by Host.
  vault-connector:
    image: lokyy-mcp-gate:beta
    build: ../stack/mcp-gate
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: connector
      CONNECTOR_VAULTS: u1,u2,u3,firma
      CONNECTOR_LISTEN_HOST: 10.231.11.2
    networks:
      mcp-upstream:
        ipv4_address: 10.231.11.2
        aliases: [mcp.vault-u1, mcp.vault-u2, mcp.vault-u3, mcp.vault-firma]
      mcp-u1: {}
      mcp-u2: {}
      mcp-u3: {}
      mcp-firma: {}

  metamcp-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      metamcp: { condition: service_healthy }
    environment:
      PGHOST: metamcp-db
      PGUSER: metamcp
      PGDATABASE: metamcp
      PGPASSWORD: ${METAMCP_PG_PASS}
      METAMCP_ADMIN_EMAIL: ${METAMCP_ADMIN_EMAIL:?set in Coolify env}
      METAMCP_ADMIN_PASS: ${METAMCP_ADMIN_PASS:?set in Coolify env}
    volumes:
      - ${LOKYY_ASSETS_DIR:?set in Coolify env}/deploy/stack/metamcp/init.sh:/init.sh:ro
    entrypoint: ["/init.sh"]
    networks: [metamcp-internal]

# COOLIFY: fixed network names ("name:") so the traefik.docker.network labels do not depend on the project
# name Coolify generates, plus the external "coolify" network (lokyy-traefik only). Subnets as in
# deploy/stack; 10.231.12/13 are new for slot u3.
networks:
  coolify:
    external: true
  edge:
    name: lokyy-edge
    ipam:
      config:
        - subnet: 10.231.0.0/28
  authentik-internal:
    name: lokyy-authentik-internal
    internal: true
    ipam:
      config:
        - subnet: 10.231.1.0/28
  metamcp-internal:
    name: lokyy-metamcp-internal
    internal: true
    ipam:
      config:
        - subnet: 10.231.2.0/28
  web-u1:
    name: lokyy-web-u1
    internal: true
    ipam:
      config:
        - subnet: 10.231.3.0/28
  web-u2:
    name: lokyy-web-u2
    internal: true
    ipam:
      config:
        - subnet: 10.231.4.0/28
  web-u3:
    name: lokyy-web-u3
    internal: true
    ipam:
      config:
        - subnet: 10.231.12.0/28
  web-firma:
    name: lokyy-web-firma
    internal: true
    ipam:
      config:
        - subnet: 10.231.5.0/28
  mcp-u1:
    name: lokyy-mcp-u1
    internal: true
    ipam:
      config:
        - subnet: 10.231.6.0/28
  mcp-u2:
    name: lokyy-mcp-u2
    internal: true
    ipam:
      config:
        - subnet: 10.231.7.0/28
  mcp-u3:
    name: lokyy-mcp-u3
    internal: true
    ipam:
      config:
        - subnet: 10.231.13.0/28
  mcp-firma:
    name: lokyy-mcp-firma
    internal: true
    ipam:
      config:
        - subnet: 10.231.8.0/28
  mcp-upstream:
    name: lokyy-mcp-upstream
    internal: true
    ipam:
      config:
        - subnet: 10.231.11.0/28
  model-egress:
    name: lokyy-model-egress
    ipam:
      config:
        - subnet: 10.231.10.0/28
  egress:
    name: lokyy-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 10.231.9.0/28

volumes:
  authentik-db:
  metamcp-db:
  # Shared embedding model cache (BGE-M3): written only by model-prefetch, read-only for vaults
  models:
  vault-u1:
  vault-u1-home:
  vault-u2:
  vault-u2-home:
  vault-u3:
  vault-u3-home:
  vault-firma:
  vault-firma-home:
