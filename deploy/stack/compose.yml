# Lokyy Brain v2 — local prototype stack (LBV2-2)
#
#   http://auth.localhost:18080      Authentik (login portal, admin)
#   http://anna.vault.localhost:18080  Anna's personal vault   (only user anna)
#   http://ben.vault.localhost:18080   Ben's personal vault    (only user ben)
#   http://firma.vault.localhost:18080 Company vault           (group vault-firma-write)
#   http://mcp.localhost:18080       MetaMCP (own login + per-endpoint API keys)
#
# Network model (the security boundary — see docs in deploy/stack/README.md):
#   edge        traefik <-> authentik, metamcp
#   web-<vault> traefik <-> exactly one vault web UI   (internal, no egress)
#   mcp-<vault> metamcp <-> exactly one vault MCP port (internal, no egress)
#   embed-<vault> exactly one vault -> shared embedding service (internal, no egress; LBV2-26)
#   egress      vaults -> internet (EUrouter); inter-container traffic disabled
# No vault publishes a port. Vaults cannot reach each other on any network.
# STACK_HTTP_PORT (default 18080), STACK_NET (default 10.231, the /16 prefix of all subnets) and IMAGE_TAG
# (default dev) let a second stack run next to this one, e.g. for tests.

name: ${STACK_NAME:-lokyy-stack}

x-vault: &vault
  image: lokyy-brain-v2:${IMAGE_TAG:-dev}
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  # No model in the vault any more (LBV2-26); measured in README "Memory"
  mem_limit: ${VAULT_MEM_LIMIT:-1g}
  depends_on:
    # Vaults embed through the shared service (LBV2-26); they do not mount the model at all.
    embed: { condition: service_healthy }
  environment: &vault-env
    MCP_HTTP_PORT: "4322"
    MINDBASE_MDNS: "off"
    # Beta decision: no capture / device pairing on hosted vaults
    MINDBASE_DISABLE_CAPTURE: "1"
    # LBV2-19: guarded vaults only call LLM hosts on this list (web server and MCP process)
    VAULT_LLM_ALLOWED_HOSTS: api.eurouter.ai
    # Persistent, per-vault cache for tesseract language data (vaults do not mount the shared /models)
    MINDBASE_MODEL_CACHE: /home/vault
    # Embeddings come from the shared service; every vault has its own token (MINDBASE_EMBED_TOKEN below)
    MINDBASE_EMBED_URL: http://embed:8080
    # Second layer if the service were ever unset: transformers.js may not download (models/offline.mjs)
    NODE_OPTIONS: --import=/lokyy/offline.mjs
    # The embedder itself also refuses downloads (apps/server/src/lib/transformers-offline.ts)
    MINDBASE_MODELS_OFFLINE: "1"

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Only this compose project: labels of other stacks on the same Docker host are ignored
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${STACK_NAME:-lokyy-stack}`)
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "127.0.0.1:${STACK_HTTP_PORT:-18080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, web-anna, web-ben, web-firma]

  # ---------------------------------------------------------------- Authentik
  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?set in .env}
    volumes: [authentik-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      retries: 10
    networks: [authentik-internal]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: server
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASS:?set in .env}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.local
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      DEMO_PASS_ANNA: ${DEMO_PASS_ANNA:?set in .env}
      DEMO_PASS_BEN: ${DEMO_PASS_BEN:?set in .env}
      DEMO_PASS_CARL: ${DEMO_PASS_CARL:?set in .env}
      # Port in the blueprint's external hosts (tests run a second stack on another port)
      STACK_HTTP_PORT: ${STACK_HTTP_PORT:-18080}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_edge
      - traefik.http.routers.authentik.rule=Host(`auth.localhost`)
      - traefik.http.routers.authentik.entrypoints=web
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      # Forward-auth middleware used by every vault router
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      # authResponseHeaders are deleted from the client request and replaced by Authentik's values
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-uid
      # Defence in depth: legacy attribution header never reaches a vault from a client
      - traefik.http.middlewares.vault-identity.headers.customrequestheaders.X-Mindbase-User=
    networks: [edge, authentik-internal]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: *authentik-env
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    networks: [authentik-internal]

  # ------------------------------------------------------------------- Vaults
  # One-shot: fills the shared model cache that vaults mount read-only (a vault cannot tamper with
  # the model files the others load). Needs internet (Hugging Face) on the first start.
  model-prefetch:
    image: lokyy-brain-v2:${IMAGE_TAG:-dev}
    restart: "no"
    entrypoint: ["node", "/prefetch/prefetch.mjs"]
    volumes:
      - models:/models
      # prefetch.mjs + manifest.json (pinned revision, sha256 per file)
      - ./models:/prefetch:ro
    networks: [model-egress]

  # Shared embedding service (LBV2-26): BGE-M3 loaded once for all vaults instead of once per vault.
  # Reachable only on the per-vault embed-<vault> networks (one vault each, internal: no egress); it
  # accepts only POST /embed with that vault's token and makes no connections of its own.
  embed:
    image: lokyy-embed:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: embed
    restart: unless-stopped
    depends_on:
      model-prefetch: { condition: service_completed_successfully }
    mem_limit: ${EMBED_MEM_LIMIT:-3584m}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EMBED_VAULTS: anna,ben,firma
      # sha256 of each vault's EMBED_TOKEN_<VAULT>, written to .env by ./embed-tokens.sh
      EMBED_TOKEN_SHA256_ANNA: ${EMBED_TOKEN_SHA256_ANNA:?run ./embed-tokens.sh}
      EMBED_TOKEN_SHA256_BEN: ${EMBED_TOKEN_SHA256_BEN:?run ./embed-tokens.sh}
      EMBED_TOKEN_SHA256_FIRMA: ${EMBED_TOKEN_SHA256_FIRMA:?run ./embed-tokens.sh}
      # A vault's token is accepted only from its own embed network (a leaked token is useless elsewhere)
      EMBED_SOURCE_ANNA: ${STACK_NET:-10.231}.12.0/28
      EMBED_SOURCE_BEN: ${STACK_NET:-10.231}.13.0/28
      EMBED_SOURCE_FIRMA: ${STACK_NET:-10.231}.14.0/28
      # Second layer on top of the service's own offline configuration
      NODE_OPTIONS: --import=/lokyy/offline.mjs
    volumes: [models:/models:ro, ./models/offline.mjs:/lokyy/offline.mjs:ro]
    networks: [embed-anna, embed-ben, embed-firma]

  vault-anna:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_ANNA:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-anna:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_ANNA:?set in .env}
      MINDBASE_EMBED_TOKEN: ${EMBED_TOKEN_ANNA:?set in .env}
      VAULT_ADMIN_GROUPS: vault-anna-admin,lokyy-admins
    volumes: [vault-anna:/data, vault-anna-home:/home/vault, ./models/offline.mjs:/lokyy/offline.mjs:ro]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-anna
      - traefik.http.routers.vault-anna.rule=Host(`anna.vault.localhost`)
      - traefik.http.routers.vault-anna.entrypoints=web
      - traefik.http.routers.vault-anna.middlewares=authentik@docker,vault-identity@docker,vault-anna-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-anna-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_ANNA}
      - traefik.http.services.vault-anna.loadbalancer.server.port=4321
      # Authentik callback path on the same host must bypass forward-auth
      - traefik.http.routers.vault-anna-outpost.rule=Host(`anna.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-anna-outpost.entrypoints=web
      - traefik.http.routers.vault-anna-outpost.service=authentik
    networks:
      web-anna: {}
      # Unique alias for vault-connector: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-anna: { aliases: [upstream.vault-anna] }
      embed-anna: {}
      egress: {}

  vault-ben:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_BEN:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-ben:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_BEN:?set in .env}
      MINDBASE_EMBED_TOKEN: ${EMBED_TOKEN_BEN:?set in .env}
      VAULT_ADMIN_GROUPS: vault-ben-admin,lokyy-admins
    volumes: [vault-ben:/data, vault-ben-home:/home/vault, ./models/offline.mjs:/lokyy/offline.mjs:ro]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-ben
      - traefik.http.routers.vault-ben.rule=Host(`ben.vault.localhost`)
      - traefik.http.routers.vault-ben.entrypoints=web
      - traefik.http.routers.vault-ben.middlewares=authentik@docker,vault-identity@docker,vault-ben-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-ben-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_BEN}
      - traefik.http.services.vault-ben.loadbalancer.server.port=4321
      - traefik.http.routers.vault-ben-outpost.rule=Host(`ben.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-ben-outpost.entrypoints=web
      - traefik.http.routers.vault-ben-outpost.service=authentik
    networks:
      web-ben: {}
      # Unique alias for vault-connector: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-ben: { aliases: [upstream.vault-ben] }
      embed-ben: {}
      egress: {}

  vault-firma:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_FIRMA:?set in .env}
      # Readers of the company vault (group vault-firma-read) get this token via MetaMCP: 12 read tools, no internal/pii pages
      MCP_HTTP_READONLY_TOKEN: ${MCP_READONLY_TOKEN_FIRMA:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-firma:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_FIRMA:?set in .env}
      MINDBASE_EMBED_TOKEN: ${EMBED_TOKEN_FIRMA:?set in .env}
      VAULT_ADMIN_GROUPS: vault-firma-admin,lokyy-admins
    volumes: [vault-firma:/data, vault-firma-home:/home/vault, ./models/offline.mjs:/lokyy/offline.mjs:ro]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-firma
      - traefik.http.routers.vault-firma.rule=Host(`firma.vault.localhost`)
      - traefik.http.routers.vault-firma.entrypoints=web
      - traefik.http.routers.vault-firma.middlewares=authentik@docker,vault-identity@docker,vault-firma-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-firma-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_FIRMA}
      - traefik.http.services.vault-firma.loadbalancer.server.port=4321
      - traefik.http.routers.vault-firma-outpost.rule=Host(`firma.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-firma-outpost.entrypoints=web
      - traefik.http.routers.vault-firma-outpost.service=authentik
    networks:
      web-firma: {}
      # Unique alias for vault-connector: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-firma: { aliases: [upstream.vault-firma] }
      embed-firma: {}
      egress: {}

  # ------------------------------------------------------------------ MetaMCP
  metamcp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metamcp
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS:?set in .env}
    volumes: [metamcp-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d metamcp -U metamcp"]
      interval: 10s
      retries: 10
    networks: [metamcp-internal]

  metamcp:
    image: ghcr.io/metatool-ai/metamcp:2.4.22
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      metamcp-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://metamcp:${METAMCP_PG_PASS}@metamcp-db:5432/metamcp
      POSTGRES_HOST: metamcp-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS}
      POSTGRES_DB: metamcp
      APP_URL: http://mcp.localhost:${STACK_HTTP_PORT:-18080}
      NEXT_PUBLIC_APP_URL: http://mcp.localhost:${STACK_HTTP_PORT:-18080}
      BETTER_AUTH_SECRET: ${METAMCP_AUTH_SECRET:?set in .env}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_edge
      # Admin UI behind Authentik (group lokyy-admins)
      # /metamcp/* is never served by the admin router (only mcp-gate handles /metamcp/<name>/mcp)
      - traefik.http.routers.metamcp.rule=Host(`mcp.localhost`) && !PathPrefix(`/metamcp/`)
      - traefik.http.routers.metamcp.entrypoints=web
      - traefik.http.routers.metamcp.middlewares=authentik@docker
      - traefik.http.routers.metamcp-outpost.rule=Host(`mcp.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.metamcp-outpost.entrypoints=web
      - traefik.http.routers.metamcp-outpost.service=authentik
      # MCP endpoints for AI clients are routed to mcp-gate (see below), never directly to MetaMCP
      - traefik.http.services.metamcp.loadbalancer.server.port=12008
    # No egress. MetaMCP shares no network with any vault: it reaches them only through vault-connector
    # (mcp-upstream), which accepts connections on that network only. Vaults cannot reach MetaMCP.
    networks: [edge, metamcp-internal, mcp-upstream]

  # Session-binding proxy for MCP clients (finding M2): a session id only works with the API key and
  # endpoint that created it. Only POST/GET/DELETE on /metamcp/<name>/mcp reach MetaMCP.
  mcp-gate:
    image: lokyy-mcp-gate:${IMAGE_TAG:-dev}
    build: ./mcp-gate
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: gate
      GATE_UPSTREAM: http://metamcp:12008
      # Global session cap derived from the provisioned users (users × 20 × 1.25, min 100)
      GATE_USERS_FILE: /etc/lokyy/users.json
    volumes:
      - ./users.json:/etc/lokyy/users.json:ro
    depends_on:
      metamcp: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_edge
      - traefik.http.routers.metamcp-endpoints.rule=Host(`mcp.localhost`) && PathRegexp(`^/metamcp/[a-z0-9-]+/mcp$`)
      - traefik.http.routers.metamcp-endpoints.entrypoints=web
      - traefik.http.routers.metamcp-endpoints.priority=100
      - traefik.http.routers.metamcp-endpoints.service=mcp-gate
      - traefik.http.services.mcp-gate.loadbalancer.server.port=8080
      # Throttle key guessing per client IP. Every 4xx/5xx (except 429) gets one static body from the gate and
      # 403/404 become 401: missing/wrong key, other user's endpoint, unknown endpoint and foreign or unknown
      # session look identical. The gate already replaces MetaMCP error bodies; this is the second layer.
      - traefik.http.routers.metamcp-endpoints.middlewares=metamcp-ratelimit@docker,metamcp-uniform-errors@docker
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.metamcp-uniform-errors.errors.status=400-428,430-599
      - traefik.http.middlewares.metamcp-uniform-errors.errors.service=mcp-gate
      - traefik.http.middlewares.metamcp-uniform-errors.errors.query=/__error
      - traefik.http.middlewares.metamcp-uniform-errors.errors.statusRewrites.403=401
      - traefik.http.middlewares.metamcp-uniform-errors.errors.statusRewrites.404=401
    networks: [edge]

  # One-way path MetaMCP -> vaults. Listens only on its fixed mcp-upstream address and routes by Host
  # (mcp.vault-<vault>:4322) to upstream.vault-<vault>; nothing on a vault network can connect to it.
  vault-connector:
    image: lokyy-mcp-gate:${IMAGE_TAG:-dev}
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: connector
      CONNECTOR_VAULTS: anna,ben,firma
      CONNECTOR_LISTEN_HOST: ${STACK_NET:-10.231}.11.2
    networks:
      mcp-upstream:
        ipv4_address: ${STACK_NET:-10.231}.11.2
        aliases: [mcp.vault-anna, mcp.vault-ben, mcp.vault-firma]
      mcp-anna: {}
      mcp-ben: {}
      mcp-firma: {}

  metamcp-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      metamcp: { condition: service_healthy }
    environment:
      PGHOST: metamcp-db
      PGUSER: metamcp
      PGDATABASE: metamcp
      PGPASSWORD: ${METAMCP_PG_PASS}
      METAMCP_ADMIN_EMAIL: admin@lokyy.local
      METAMCP_ADMIN_PASS: ${METAMCP_ADMIN_PASS:?set in .env}
    volumes:
      - ./metamcp/init.sh:/init.sh:ro
    entrypoint: ["/init.sh"]
    networks: [metamcp-internal]

# Explicit subnets: the host's default Docker address pools are exhausted.
networks:
  edge:
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.0.0/28
  authentik-internal:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.1.0/28
  metamcp-internal:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.2.0/28
  web-anna:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.3.0/28
  web-ben:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.4.0/28
  web-firma:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.5.0/28
  mcp-anna:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.6.0/28
  mcp-ben:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.7.0/28
  mcp-firma:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.8.0/28
  mcp-upstream:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.11.0/28
  embed-anna:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.12.0/28
  embed-ben:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.13.0/28
  embed-firma:
    internal: true
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.14.0/28
  model-egress:
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.10.0/28
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: ${STACK_NET:-10.231}.9.0/28

volumes:
  authentik-db:
  vault-anna-home:
  vault-ben-home:
  vault-firma-home:
  # Embedding model cache (BGE-M3): written only by model-prefetch, mounted read-only by embed
  models:
  metamcp-db:
  vault-anna:
  vault-ben:
  vault-firma:
