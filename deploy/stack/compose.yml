# Lokyy Brain v2 — local prototype stack (LBV2-2)
#
#   http://auth.localhost:18080      Authentik (login portal, admin)
#   http://anna.vault.localhost:18080  Anna's personal vault   (only user anna)
#   http://ben.vault.localhost:18080   Ben's personal vault    (only user ben)
#   http://firma.vault.localhost:18080 Company vault           (group vault-firma-write)
#   http://mcp.localhost:18080       MetaMCP (own login + per-endpoint API keys)
#
# Network model (the security boundary — see docs in deploy/stack/README.md):
#   edge        traefik <-> authentik, metamcp
#   web-<vault> traefik <-> exactly one vault web UI   (internal, no egress)
#   mcp-<vault> metamcp <-> exactly one vault MCP port (internal, no egress)
#   egress      vaults -> internet (EUrouter, model download); inter-container traffic disabled
# No vault publishes a port. Vaults cannot reach each other on any network.

name: ${STACK_NAME:-lokyy-stack}

x-vault: &vault
  image: lokyy-brain-v2:dev
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &vault-env
    MCP_HTTP_PORT: "4322"
    MINDBASE_MDNS: "off"
    # Beta decision: no capture / device pairing on hosted vaults
    MINDBASE_DISABLE_CAPTURE: "1"

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, web-anna, web-ben, web-firma]

  # ---------------------------------------------------------------- Authentik
  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?set in .env}
    volumes: [authentik-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      retries: 10
    networks: [authentik-internal]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: server
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASS:?set in .env}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.local
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      DEMO_PASS_ANNA: ${DEMO_PASS_ANNA:?set in .env}
      DEMO_PASS_BEN: ${DEMO_PASS_BEN:?set in .env}
      DEMO_PASS_CARL: ${DEMO_PASS_CARL:?set in .env}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_edge
      - traefik.http.routers.authentik.rule=Host(`auth.localhost`)
      - traefik.http.routers.authentik.entrypoints=web
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      # Forward-auth middleware used by every vault router
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      # authResponseHeaders are deleted from the client request and replaced by Authentik's values
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-uid
      # Defence in depth: legacy attribution header never reaches a vault from a client
      - traefik.http.middlewares.vault-identity.headers.customrequestheaders.X-Mindbase-User=
    networks: [edge, authentik-internal]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-db: { condition: service_healthy }
    environment: *authentik-env
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    networks: [authentik-internal]

  # ------------------------------------------------------------------- Vaults
  vault-anna:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_ANNA:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-anna:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_ANNA:?set in .env}
      VAULT_ADMIN_GROUPS: vault-anna-admin,lokyy-admins
    volumes: [vault-anna:/data, models:/models]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-anna
      - traefik.http.routers.vault-anna.rule=Host(`anna.vault.localhost`)
      - traefik.http.routers.vault-anna.entrypoints=web
      - traefik.http.routers.vault-anna.middlewares=authentik@docker,vault-identity@docker,vault-anna-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-anna-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_ANNA}
      - traefik.http.services.vault-anna.loadbalancer.server.port=4321
      # Authentik callback path on the same host must bypass forward-auth
      - traefik.http.routers.vault-anna-outpost.rule=Host(`anna.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-anna-outpost.entrypoints=web
      - traefik.http.routers.vault-anna-outpost.service=authentik
    networks:
      web-anna: {}
      # Unique alias: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-anna: { aliases: [mcp.vault-anna] }
      egress: {}

  vault-ben:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_BEN:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-ben:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_BEN:?set in .env}
      VAULT_ADMIN_GROUPS: vault-ben-admin,lokyy-admins
    volumes: [vault-ben:/data, models:/models]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-ben
      - traefik.http.routers.vault-ben.rule=Host(`ben.vault.localhost`)
      - traefik.http.routers.vault-ben.entrypoints=web
      - traefik.http.routers.vault-ben.middlewares=authentik@docker,vault-identity@docker,vault-ben-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-ben-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_BEN}
      - traefik.http.services.vault-ben.loadbalancer.server.port=4321
      - traefik.http.routers.vault-ben-outpost.rule=Host(`ben.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-ben-outpost.entrypoints=web
      - traefik.http.routers.vault-ben-outpost.service=authentik
    networks:
      web-ben: {}
      # Unique alias: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-ben: { aliases: [mcp.vault-ben] }
      egress: {}

  vault-firma:
    <<: *vault
    environment:
      <<: *vault-env
      MCP_HTTP_TOKEN: ${MCP_TOKEN_FIRMA:?set in .env}
      # Readers of the company vault (group vault-firma-read) get this token via MetaMCP: 12 read tools, no internal/pii pages
      MCP_HTTP_READONLY_TOKEN: ${MCP_READONLY_TOKEN_FIRMA:?set in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp.vault-firma:4322
      VAULT_PROXY_SECRET: ${PROXY_SECRET_FIRMA:?set in .env}
      VAULT_ADMIN_GROUPS: vault-firma-admin,lokyy-admins
    volumes: [vault-firma:/data, models:/models]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_web-firma
      - traefik.http.routers.vault-firma.rule=Host(`firma.vault.localhost`)
      - traefik.http.routers.vault-firma.entrypoints=web
      - traefik.http.routers.vault-firma.middlewares=authentik@docker,vault-identity@docker,vault-firma-secret@docker
      # Overwrites any client-supplied value; only this router carries this vault's secret
      - traefik.http.middlewares.vault-firma-secret.headers.customrequestheaders.X-Vault-Proxy-Secret=${PROXY_SECRET_FIRMA}
      - traefik.http.services.vault-firma.loadbalancer.server.port=4321
      - traefik.http.routers.vault-firma-outpost.rule=Host(`firma.vault.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.vault-firma-outpost.entrypoints=web
      - traefik.http.routers.vault-firma-outpost.service=authentik
    networks:
      web-firma: {}
      # Unique alias: a plain service name could resolve to the egress IP, where traffic is blocked
      mcp-firma: { aliases: [mcp.vault-firma] }
      egress: {}

  # ------------------------------------------------------------------ MetaMCP
  metamcp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metamcp
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS:?set in .env}
    volumes: [metamcp-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d metamcp -U metamcp"]
      interval: 10s
      retries: 10
    networks: [metamcp-internal]

  metamcp:
    image: ghcr.io/metatool-ai/metamcp:2.4.22
    restart: unless-stopped
    depends_on:
      metamcp-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://metamcp:${METAMCP_PG_PASS}@metamcp-db:5432/metamcp
      POSTGRES_HOST: metamcp-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${METAMCP_PG_PASS}
      POSTGRES_DB: metamcp
      APP_URL: http://mcp.localhost:18080
      NEXT_PUBLIC_APP_URL: http://mcp.localhost:18080
      BETTER_AUTH_SECRET: ${METAMCP_AUTH_SECRET:?set in .env}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${STACK_NAME:-lokyy-stack}_edge
      # Admin UI behind Authentik (group lokyy-admins)
      - traefik.http.routers.metamcp.rule=Host(`mcp.localhost`)
      - traefik.http.routers.metamcp.entrypoints=web
      - traefik.http.routers.metamcp.middlewares=authentik@docker
      - traefik.http.routers.metamcp-outpost.rule=Host(`mcp.localhost`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.metamcp-outpost.entrypoints=web
      - traefik.http.routers.metamcp-outpost.service=authentik
      # MCP endpoints for AI clients: authenticated by MetaMCP API key, not browser SSO
      # Only Streamable HTTP of a named endpoint: no endpoint catalogue (GET /metamcp/), no SSE/OpenAPI surface
      - traefik.http.routers.metamcp-endpoints.rule=Host(`mcp.localhost`) && PathRegexp(`^/metamcp/[a-z0-9-]+/mcp$`)
      - traefik.http.routers.metamcp-endpoints.entrypoints=web
      - traefik.http.routers.metamcp-endpoints.priority=100
      # Throttle key guessing / endpoint enumeration per client IP; unknown endpoints answer 401 like a wrong key
      - traefik.http.routers.metamcp-endpoints.middlewares=metamcp-ratelimit@docker,metamcp-unknown-endpoint@docker
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.metamcp-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.metamcp-unknown-endpoint.errors.status=404
      - traefik.http.middlewares.metamcp-unknown-endpoint.errors.service=metamcp
      - traefik.http.middlewares.metamcp-unknown-endpoint.errors.query=/metamcp/health
      - traefik.http.middlewares.metamcp-unknown-endpoint.errors.statusRewrites.404=401
      - traefik.http.routers.metamcp-endpoints.service=metamcp
      - traefik.http.services.metamcp.loadbalancer.server.port=12008
    # No egress: MetaMCP only talks to vaults over HTTP, never runs stdio servers or fetches packages
    networks: [edge, metamcp-internal, mcp-anna, mcp-ben, mcp-firma]

  metamcp-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      metamcp: { condition: service_healthy }
    environment:
      PGHOST: metamcp-db
      PGUSER: metamcp
      PGDATABASE: metamcp
      PGPASSWORD: ${METAMCP_PG_PASS}
      METAMCP_ADMIN_EMAIL: admin@lokyy.local
      METAMCP_ADMIN_PASS: ${METAMCP_ADMIN_PASS:?set in .env}
    volumes:
      - ./metamcp/init.sh:/init.sh:ro
    entrypoint: ["/init.sh"]
    networks: [metamcp-internal]

# Explicit subnets: the host's default Docker address pools are exhausted.
networks:
  edge:
    ipam:
      config:
        - subnet: 10.231.0.0/28
  authentik-internal:
    internal: true
    ipam:
      config:
        - subnet: 10.231.1.0/28
  metamcp-internal:
    internal: true
    ipam:
      config:
        - subnet: 10.231.2.0/28
  web-anna:
    internal: true
    ipam:
      config:
        - subnet: 10.231.3.0/28
  web-ben:
    internal: true
    ipam:
      config:
        - subnet: 10.231.4.0/28
  web-firma:
    internal: true
    ipam:
      config:
        - subnet: 10.231.5.0/28
  mcp-anna:
    internal: true
    ipam:
      config:
        - subnet: 10.231.6.0/28
  mcp-ben:
    internal: true
    ipam:
      config:
        - subnet: 10.231.7.0/28
  mcp-firma:
    internal: true
    ipam:
      config:
        - subnet: 10.231.8.0/28
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 10.231.9.0/28

volumes:
  authentik-db:
  # Shared embedding model cache (BGE-M3), read and written by every vault
  models:
  metamcp-db:
  vault-anna:
  vault-ben:
  vault-firma:
